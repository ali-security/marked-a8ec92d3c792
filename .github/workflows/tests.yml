name: "Tests"
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Jasmine --filter regex to run a subset of specs (empty = full suite)'
        required: false
        default: ''

jobs:
  Test:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    strategy:
      matrix:
        node_version: ['lts/*', 'node']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2
      - name: Install Node
        uses: dcodeIO/setup-node-nvm@master
        with:
          node-version: ${{ matrix.node_version }}
      - name: Install Dependencies
        run: npm ci
      - name: Run Unit Tests 👩🏽‍💻
        shell: bash
        run: npm run test:unit -- ${{ inputs.test-filter && format('--filter={0}', inputs.test-filter) || '' }} 2>&1 | tee unit-tests.log
      - name: Run Spec Tests 👩🏽‍💻
        shell: bash
        run: npm run test:specs -- ${{ inputs.test-filter && format('--filter={0}', inputs.test-filter) || '' }} 2>&1 | tee spec-tests.log
      - name: Test Summary
        shell: bash
        run: |
          unit=$(grep -oE '^[0-9]+ specs?, 0 failures' unit-tests.log | grep -oE '^[0-9]+')
          specs=$(grep -oE '^[0-9]+ specs?, 0 failures' spec-tests.log | grep -oE '^[0-9]+')
          echo "Test summary: unit=${unit} specs=${specs} total=$((unit + specs)) specs passed, 0 failures"
      - name: Build 🗜️
        if: matrix.node_version == 'lts/*'
        run: npm run build
      - name: Pack 📦
        if: matrix.node_version == 'lts/*'
        run: npm pack
      - name: Upload Package
        if: matrix.node_version == 'lts/*'
        uses: actions/upload-artifact@v4
        with:
          name: marked-npm-package
          path: marked-*.tgz
          if-no-files-found: error

  Lint:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2
      - name: Install Dependencies
        run: npm ci
      - name: Lint ✨
        run: npm run test:lint

  Release:
    needs: [Test, Lint]
    if: |
      github.ref == 'refs/heads/master' &&
      github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2
      - name: Install Dependencies
        run: npm ci
      - name: Build 🗜️
        run: |
          npm run build
          if ! git diff --quiet; then
            git config --global user.email "<>"
            git config --global user.name "MarkedJS bot"
            git commit -am "🗜️ build [skip ci]"
          fi
      - name: Release 🎉
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release

  Skip:
    if: contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Skip CI 🚫
        run: echo skip ci
